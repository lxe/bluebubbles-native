[package]
name = "bluebubbles-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast, native Rust + GTK 4 + libadwaita desktop client for BlueBubbles Server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lxe/bluebubbles-native"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "native-tls", "query"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
async-channel = "2"
